[project]
name = "hermes-telegram-business"
version = "0.7.2"
description = "Update-persistent Telegram Business integration for Hermes Agent with voice, video-note, and attached-audio transcription and Business-scoped replies."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "neoromantic" }]

[project.urls]
Homepage = "https://github.com/neoromantic/hermes-telegram-business"
Source = "https://github.com/neoromantic/hermes-telegram-business"
Issues = "https://github.com/neoromantic/hermes-telegram-business/issues"
Changelog = "https://github.com/neoromantic/hermes-telegram-business/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
