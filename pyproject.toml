[project]
name = "hermes-telegram-business"
version = "0.8.0"
description = "Telegram Business integration for Hermes Agent with voice transcription and searchable opt-in text history."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "neoromantic" }]

[project.urls]
Homepage = "https://github.com/neoromantic/hermes-telegram-business"
Source = "https://github.com/neoromantic/hermes-telegram-business"
Issues = "https://github.com/neoromantic/hermes-telegram-business/issues"
Changelog = "https://github.com/neoromantic/hermes-telegram-business/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --confcutdir=tests"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".scratch"]

# Keep the established correctness checks stable across Ruff default changes.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
