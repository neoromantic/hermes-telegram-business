manifest_version: 2
name: telesec
version: 0.10.0
description: "Telesec — Telegram Business secretary for Hermes."
author: neoromantic
license: MIT
homepage: https://telesec.sergeybaus.com
tags: [telegram, business, voice, history]
requires_hermes: ">=0.21.6"
kind: standalone
provides_hooks:
  - pre_gateway_dispatch
config_schema:
  history_enable: {type: bool, default: false, description: "Capture Business text history."}
  dossier_enable: {type: bool, default: false, description: "Build contact dossiers using the configured model; restart the gateway after enabling."}
  cleanup_style: {type: str, default: conservative, choices: [conservative, enriched], description: "Voice transcript cleanup style."}
  timezone: {type: str, default: UTC, description: "IANA timezone for correspondence statistics."}
  agent_enable: {type: bool, default: false, description: "Pass unhandled Business updates to the Hermes agent."}
