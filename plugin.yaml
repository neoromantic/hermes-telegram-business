manifest_version: 2
name: telesec
version: 0.14.0
description: "Telesec — Telegram Business secretary for Hermes."
author: neoromantic
license: MIT
homepage: https://telesec.sergeybaus.com
tags: [telegram, business, voice, history]
requires_hermes: ">=0.21.6"
kind: standalone
provides_hooks:
  - pre_gateway_dispatch
config_schema:
  cleanup_style: {type: str, default: conservative, choices: [conservative, enriched], description: "Voice transcript cleanup style."}
  agent_enable: {type: bool, default: false, description: "Pass unhandled Business updates to the Hermes agent."}
