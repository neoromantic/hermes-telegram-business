# Based on devkit's templates/ci.python.yml, with a Python version matrix:
# Telesec runs inside whatever Python the Hermes gateway uses, 3.11 to 3.14.
# Edited here on purpose, so devkit sync leaves this file alone.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: neoromantic/devkit/.github/workflows/ci-python.yml@v1
    permissions:
      contents: read
    with:
      python-version: '["3.11","3.12","3.13","3.14"]'

  hygiene:
    uses: neoromantic/devkit/.github/workflows/hygiene.yml@v1
    permissions:
      contents: read

  # The one required check for the branch ruleset. It is named exactly "ci".
  ci:
    needs: [build, hygiene]
    if: always() && github.event.pull_request.draft != true
    runs-on: ${{ fromJSON('{"true":"oss-linux","false":"ubuntu-latest"}')[format('{0}', vars.CI_SELF_HOSTED == 'true' && github.ref == 'refs/heads/main')] }}
    permissions: {}
    steps:
      - name: All jobs passed
        # A step `if:` without a status function implies success(), which is false when a
        # needed job was cancelled (say, no runner picked it up). Without always() the step
        # is then skipped and the gate passes.
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1
